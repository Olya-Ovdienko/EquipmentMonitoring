name: equipmentmonitoring
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equipmentmonitoring-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      DatabaseProvider: Npgsql
      ConnectionStrings__EquipmentDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equipmentmonitoring

  postgres:
    image: postgres:17
    container_name: equipmentmonitoring-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - equipmentmonitoring

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: equipmentmonitoring-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equipmentmonitoring

volumes:
  postgres_data:
    name: equipmentmonitoring-postgres-data

networks:
  equipmentmonitoring:
    name: equipmentmonitoring-network
    driver: bridge
